      icon: "spatiu"

  pas2_titlu: "Ce lucrări îți sunt necesare?"
  pas2_sub: "Bifează toate categoriile de lucrări de care ai nevoie."
  pas2_placeholder: "Ex: două băi, tavan suspendat în living, schimbarea parchetului..."
  lucrari:
    - nume: "Pereți și tavane"
      thumb: "/images/reparatii/thumb-01.jpg"
      ph: "/images/reparatii/ph/thumb-01.svg"
    - nume: "Gresie și faianță"
      thumb: "/images/reparatii/thumb-02.jpg"
      ph: "/images/reparatii/ph/thumb-02.svg"
    - nume: "Pardoseli și parchet"
      thumb: "/images/reparatii/thumb-03.jpg"
      ph: "/images/reparatii/ph/thumb-03.svg"
    - nume: "Zugrăveli și vopsitorii"
      thumb: "/images/reparatii/thumb-04.jpg"
      ph: "/images/reparatii/ph/thumb-04.svg"
    - nume: "Reparații băi"
      thumb: "/images/reparatii/thumb-05.jpg"
      ph: "/images/reparatii/ph/thumb-05.svg"
    - nume: "Reparații bucătării"
      thumb: "/images/reparatii/thumb-06.jpg"
      ph: "/images/reparatii/ph/thumb-06.svg"
    - nume: "Lucrări electrice"
      thumb: "/images/reparatii/thumb-07.jpg"
      ph: "/images/reparatii/ph/thumb-07.svg"
    - nume: "Lucrări sanitare și termice"
      thumb: "/images/reparatii/thumb-08.jpg"
      ph: "/images/reparatii/ph/thumb-08.svg"
    - nume: "Compartimentări interioare"
      thumb: "/images/reparatii/thumb-09.jpg"
      ph: "/images/reparatii/ph/thumb-09.svg"
    - nume: "Montaj și finisaje finale"
      thumb: "/images/reparatii/thumb-10.jpg"
      ph: "/images/reparatii/ph/thumb-10.svg"

  pas3_titlu: "Detalii despre Spațiu"
  pas3_sub: "Completează câteva informații pentru o ofertă precisă."
  pas3_campuri:
    - { nume: "suprafata", label: "Suprafață estimativă (m²)", tip: "number", placeholder: "ex: 60" }
    - { nume: "localitate", label: "Localitate", tip: "text", placeholder: "ex: Chișinău" }
    - { nume: "stadiu", label: "Stadiul actual", tip: "text", placeholder: "ex: spațiu nou / locuit / după demolare" }
    - { nume: "buget", label: "Buget estimativ", tip: "text", placeholder: "ex: 5.000 – 10.000 €" }

