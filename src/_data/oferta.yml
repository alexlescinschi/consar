    - "Randări Exterior"
    - "Randări Interior Design"
    - "Randări Design Peisagistic"
    - "Randări Produs / Marketing"
    - "Animații 3D Imobiliare"

reparatii:
  pas1_titlu: "Ce tip de spațiu vrei să renovezi?"
  pas1_sub: "Selectează tipul spațiului."
  pas1:
    - valoare: "Apartament"
      icon: "apartament"
    - valoare: "Casă"
      icon: "casa"
