# Configurație centrală pentru modalul "Solicită Ofertă".
# Componenta: src/_includes/oferta-modal.njk
# Paginile aleg varianta prin frontmatter:  varianta_oferta: reparatii
# Aici ajustezi titluri, opțiuni și imagini — fără să atingi paginile.

arhitectura:
  pas1_titlu: "Alege categoria de proiect"
  pas1_sub: "Selectează o opțiune principală."
  pas1:
    - valoare: "Construcții rezidențiale"
      icon: "house"
    - valoare: "Clădiri comerciale"
      icon: "comercial"
    - valoare: "Clădiri publice și instituționale"
      icon: "public"
    - valoare: "Construcții industriale"
      icon: "industrial"
    - valoare: "Turism și agrement"
      icon: "turism"
    - valoare: "Amenajări exterioare și urbanism"
      icon: "urbanism"
    - valoare: "Reabilitări și restaurări"
      icon: "renov"

  pas2_titlu: "Detalii despre Proiect"

  stil:
    - { nume: "Vilă", thumb: "/images/thumbnails/4.jpg" }
    - { nume: "Bungalow", thumb: "/images/thumbnails/5.jpg" }
    - { nume: "Cărămidă", thumb: "/images/thumbnails/6.jpg" }
    - { nume: "Beton", thumb: "/images/thumbnails/7.jpg" }
    - { nume: "Metalică", thumb: "/images/thumbnails/8.jpg" }
    - { nume: "Lemn", thumb: "/images/thumbnails/9.jpg" }
    - { nume: "Modulară", thumb: "/images/thumbnails/10.jpg" }
    - { nume: "Modernă", thumb: "/images/thumbnails/11.jpg" }
    - { nume: "Contemporană", thumb: "/images/thumbnails/12.jpg" }
    - { nume: "Tradițională", thumb: "/images/thumbnails/13.jpg" }
    - { nume: "Rustic", thumb: "/images/thumbnails/14.jpg" }
    - { nume: "Mediteraneană", thumb: "/images/thumbnails/15.jpg" }
    - { nume: "Scandinavă", thumb: "/images/thumbnails/16.jpg" }
    - { nume: "Industrială", thumb: "/images/thumbnails/17.jpg" }
    - { nume: "Pasivă", thumb: "/images/thumbnails/18.jpg" }
    - { nume: "Smart", thumb: "/images/thumbnails/19.jpg" }
    - { nume: "Ecologică", thumb: "/images/thumbnails/20.jpg" }
    - { nume: "Tiny", thumb: "/images/thumbnails/21.jpg" }
